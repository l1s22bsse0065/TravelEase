name: wf-ci-production

on:
  pull_request:
    branches:
      - production
    types:
      - opened
      - synchronize

jobs:
  linting-job-production:
    name: Lint & Build on Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Lint HTML Files with HTMLHint
        run: npx htmlhint "./src/**/*.html"

      - name: Lint CSS Files with Stylelint
        run: npx stylelint "./styles/**/*.css"

      - name: Test Build with Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"
