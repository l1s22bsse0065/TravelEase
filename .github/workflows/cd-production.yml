name: wf-cd-production

on:
  push:
    branches:
      - production

jobs:
  upload-job-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build Static Website With Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          name: "build-artifact-production"

  deploy-job-production:
    needs: upload-job-production
    runs-on: ubuntu-latest
    environment:
      name: production-env
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy Website on GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: "build-artifact-production"
          token: ${{ secrets.GITHUB_TOKEN }}
