name: wf-deploy-develop

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-job-develop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository On the Runner
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build Static Website With Parcel
        run: npx parcel build "src/*.html" --dist-dir dist --public-url ./



      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: build-artifact-develop

  deploy-job-develop:
    needs: build-job-develop
    runs-on: ubuntu-latest
    environment:
      name: develop-env
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Website On GH-Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: build-artifact-develop
